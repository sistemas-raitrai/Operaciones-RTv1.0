<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Calendario de Actividades</title>

  <!-- DataTables -->
  <link
    rel="stylesheet"
    href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css"
  >

  <!-- Botones DataTables -->
  <link
    rel="stylesheet"
    href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.dataTables.min.css"
  >

  <!-- FixedHeader -->
  <link
    rel="stylesheet"
    href="https://cdn.datatables.net/fixedheader/3.3.2/css/fixedHeader.dataTables.min.css"
  >

  <!-- FixedColumns -->
  <!-- Estilos generales -->
  <link
    rel="stylesheet"
    href="estilos.css"
  >

  <link
    rel="icon"
    type="image/png"
    href="Logo Raitrai.png"
  >

  <style>
    /* ==================================================
       ESTRUCTURA GENERAL
    ================================================== */

    main {
      width: 100%;
      max-width: none;
      padding-right: 18px;
      padding-left: 18px;
      box-sizing: border-box;
    }

    .calendar-source-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: -5px 0 15px;
      color: #64748b;
      font-size: 13px;
    }

    .calendar-source-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #16a34a;
    }


    /* ==================================================
       BARRA DE CARGA
    ================================================== */

    .load-box {
      width: 100%;
      max-width: 720px;
      margin: 12px 0 18px;
      padding: 12px 14px;
      border: 1px solid #d7dbe3;
      border-radius: 8px;
      background: #f8fafc;
      box-sizing: border-box;
    }

    #loadTitle {
      margin-bottom: 4px;
      font-weight: 700;
    }

    #loadDetail {
      margin-bottom: 8px;
      color: #555;
      font-size: 13px;
    }

    .load-track {
      width: 100%;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5e7eb;
    }

    .load-progress {
      width: 0%;
      height: 100%;
      background: #005baa;
      transition: width 0.25s ease;
    }

    .load-box.ok .load-progress {
      background: #16a34a;
    }

    .load-box.error .load-progress {
      background: #dc2626;
    }


    /* ==================================================
       TOOLBAR
    ================================================== */

    #toolbar {
      margin-bottom: 14px;
    }

    #toolbar .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    #toolbar .column {
      margin: 0;
    }

    #toolbar .column.long {
      min-width: 260px;
      flex: 1 1 340px;
    }

    #toolbar .column.medium {
      flex: 0 1 190px;
    }

    #toolbar input,
    #toolbar select,
    #toolbar button {
      min-height: 40px;
      box-sizing: border-box;
    }

    #toolbar input,
    #toolbar select {
      width: 100%;
    }

    #toolbar button {
      white-space: nowrap;
    }

    #btn-toggle-edit.activo {
      color: #fff;
      border-color: #b45309;
      background: #d97706;
    }


    /* ==================================================
       SCROLL HORIZONTAL SUPERIOR
    ================================================== */

    #scrollCalendarioSuperior {
      display: none;
      width: 100%;
      height: 18px;
      margin: 4px 0 5px;
      overflow-x: auto;
      overflow-y: hidden;
      border: 1px solid #dbe1e8;
      border-radius: 5px;
      background: #f8fafc;
      box-sizing: border-box;
    }

    #scrollCalendarioSuperiorContenido {
      height: 1px;
    }


    /* ==================================================
       CONTENEDOR DATATABLE
    ================================================== */

    .tabla-calendario-wrapper {
      position: relative;
      width: 100%;
    }

    #tablaCalendario {
      width: max-content !important;
      min-width: 100%;
    }

    div.dataTables_wrapper {
      width: 100%;
    }

    div.dataTables_scroll {
      border: 1px solid #d7dde5;
      border-radius: 8px;
      background: #fff;
    }

    div.dataTables_scrollHead {
      position: relative;
      z-index: 40;
      overflow: hidden !important;
      background: #eef4fa;
    }
    
    div.dataTables_scrollBody {
      position: relative;
      background: #fff;
    }

    div.dataTables_scrollBody::-webkit-scrollbar,
    #scrollCalendarioSuperior::-webkit-scrollbar {
      height: 14px;
    }

    div.dataTables_scrollBody::-webkit-scrollbar-thumb,
    #scrollCalendarioSuperior::-webkit-scrollbar-thumb {
      border: 3px solid transparent;
      border-radius: 999px;
      background: #8493a6;
      background-clip: padding-box;
    }

    div.dataTables_scrollBody::-webkit-scrollbar-track,
    #scrollCalendarioSuperior::-webkit-scrollbar-track {
      background: #edf1f5;
    }


    /* ==================================================
       TABLA
    ================================================== */

    #tablaCalendario {
      width: 100% !important;
      border-collapse: separate !important;
      border-spacing: 0;
      table-layout: fixed !important;
    }
    
    /*
      DataTables crea una tabla para el encabezado
      y otra para el cuerpo. Ambas deben usar
      exactamente el mismo sistema de anchos.
    */
    #tablaCalendario_wrapper .dataTables_scrollHeadInner,
    #tablaCalendario_wrapper .dataTables_scrollHeadInner table,
    #tablaCalendario_wrapper .dataTables_scrollBody table {
      table-layout: fixed !important;
    }

    #tablaCalendario thead th {
      padding: 10px 9px;
      border-right: 1px solid #cbd5e1;
      border-bottom: 2px solid #94a3b8;
      color: #18334f;
      background: #eaf1f8;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      vertical-align: middle;
      white-space: normal;
    }

    #tablaCalendario tbody td {
      padding: 10px 9px;
      border-right: 1px solid #dde3ea;
      border-bottom: 1px solid #d9e0e7;
      color: #263746;
      font-size: 12px;
      line-height: 1.42;
      vertical-align: top;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    #tablaCalendario tbody tr:nth-child(odd) td {
      background: #ffffff;
    }

    #tablaCalendario tbody tr:nth-child(even) td {
      background: #f5f8fb;
    }

    /*
      Las primeras seis columnas corresponden a:
      N° Negocio, Grupo, Pax, Destino, Hoteles y Vuelos.
    */

    #tablaCalendario thead th:nth-child(-n+6) {
      background: #dce9f5;
    }

    #tablaCalendario tbody tr:nth-child(odd) td:nth-child(-n+6) {
      background: #f1f6fb;
    }

    #tablaCalendario tbody tr:nth-child(even) td:nth-child(-n+6) {
      background: #e8f0f7;
    }

    #tablaCalendario thead th:nth-child(-n+6) {
      background: #dce9f5 !important;
    }
    
    #tablaCalendario tbody tr:nth-child(odd) td:nth-child(-n+6) {
      background: #f1f6fb !important;
    }
    
    #tablaCalendario tbody tr:nth-child(even) td:nth-child(-n+6) {
      background: #e8f0f7 !important;
    }

    #tablaCalendario th:nth-child(6),
    #tablaCalendario td:nth-child(6) {
      border-right: 3px solid #7d97b0 !important;
      box-shadow: 7px 0 10px -9px rgba(15, 23, 42, 0.75);
    }

    #tablaCalendario td[data-fecha],
    #tablaCalendario th[data-fechaiso] {
      width: 210px;
      min-width: 210px;
      max-width: 210px;
    }

    #tablaCalendario .domingo {
      background: #edf1f5 !important;
    }

    #tablaCalendario .inicio-fin {
      background: #e1efff !important;
    }

    #tablaCalendario td[contenteditable="true"] {
      cursor: text;
      outline: 2px dashed #f59e0b;
      outline-offset: -4px;
      background: #fff8d8 !important;
    }

    #tablaCalendario td.guardando {
      opacity: 0.65;
      background: #fef3c7 !important;
    }

    #tablaCalendario td.guardado {
      background: #dcfce7 !important;
    }

    #tablaCalendario td.error-guardado {
      background: #fee2e2 !important;
    }


    /* ==================================================
       ANCHOS DE COLUMNAS FIJAS
    ================================================== */

    /* N° Negocio */
    #tablaCalendario th:nth-child(1),
    #tablaCalendario td:nth-child(1) {
      width: 90px !important;
      min-width: 90px !important;
      max-width: 90px !important;
    }

    /* ==================================================
       PRIMERAS 6 COLUMNAS FIJAS CON CSS STICKY
       Compatible con scrollX de DataTables
    ================================================== */
    
    /* N° Negocio */
    #tablaCalendario_wrapper .dataTables_scrollHead th:nth-child(1),
    #tablaCalendario_wrapper .dataTables_scrollBody td:nth-child(1) {
      position: sticky !important;
      left: 0 !important;
    }
    
    /* Grupo */
    #tablaCalendario_wrapper .dataTables_scrollHead th:nth-child(2),
    #tablaCalendario_wrapper .dataTables_scrollBody td:nth-child(2) {
      position: sticky !important;
      left: 90px !important;
    }
    
    /* Pax */
    #tablaCalendario_wrapper .dataTables_scrollHead th:nth-child(3),
    #tablaCalendario_wrapper .dataTables_scrollBody td:nth-child(3) {
      position: sticky !important;
      left: 315px !important;
    }
    
    /* Destino / Programa */
    #tablaCalendario_wrapper .dataTables_scrollHead th:nth-child(4),
    #tablaCalendario_wrapper .dataTables_scrollBody td:nth-child(4) {
      position: sticky !important;
      left: 415px !important;
    }
    
    /* Hoteles */
    #tablaCalendario_wrapper .dataTables_scrollHead th:nth-child(5),
    #tablaCalendario_wrapper .dataTables_scrollBody td:nth-child(5) {
      position: sticky !important;
      left: 605px !important;
    }
    
    /* Vuelos */
    #tablaCalendario_wrapper .dataTables_scrollHead th:nth-child(6),
    #tablaCalendario_wrapper .dataTables_scrollBody td:nth-child(6) {
      position: sticky !important;
      left: 830px !important;
    }

    /* Encabezados fijos por encima del contenido */
    #tablaCalendario_wrapper .dataTables_scrollHead th:nth-child(-n+6) {
      z-index: 50 !important;
      background: #dce9f5 !important;
    }
    
    /* Celdas fijas del cuerpo */
    #tablaCalendario_wrapper .dataTables_scrollBody td:nth-child(-n+6) {
      z-index: 20 !important;
      background-clip: padding-box !important;
    }
    
    /* Filas impares */
    #tablaCalendario_wrapper .dataTables_scrollBody
    tbody tr:nth-child(odd) td:nth-child(-n+6) {
      background: #f1f6fb !important;
    }
    
    /* Filas pares */
    #tablaCalendario_wrapper .dataTables_scrollBody
    tbody tr:nth-child(even) td:nth-child(-n+6) {
      background: #e8f0f7 !important;
    }
    
    /* Separación después de Vuelos */
    #tablaCalendario_wrapper .dataTables_scrollHead th:nth-child(6),
    #tablaCalendario_wrapper .dataTables_scrollBody td:nth-child(6) {
      border-right: 3px solid #7d97b0 !important;
    
      box-shadow:
        8px 0 12px -10px
        rgba(15, 23, 42, 0.9);
    }
    
    /* Grupo */
    #tablaCalendario th:nth-child(2),
    #tablaCalendario td:nth-child(2) {
      width: 225px !important;
      min-width: 225px !important;
      max-width: 225px !important;
    }
    
    /* Pax */
    #tablaCalendario th:nth-child(3),
    #tablaCalendario td:nth-child(3) {
      width: 100px !important;
      min-width: 100px !important;
      max-width: 100px !important;
    }
    
    /* Destino / Programa */
    #tablaCalendario th:nth-child(4),
    #tablaCalendario td:nth-child(4) {
      width: 190px !important;
      min-width: 190px !important;
      max-width: 190px !important;
    }
    
    /* Hoteles */
    #tablaCalendario th:nth-child(5),
    #tablaCalendario td:nth-child(5) {
      width: 225px !important;
      min-width: 225px !important;
      max-width: 225px !important;
    }
    
    /* Vuelos */
    #tablaCalendario th:nth-child(6),
    #tablaCalendario td:nth-child(6) {
      width: 320px !important;
      min-width: 320px !important;
      max-width: 320px !important;
    }
    
    /* Fechas */
    #tablaCalendario th[data-fechaiso],
    #tablaCalendario td[data-fecha] {
      width: 210px !important;
      min-width: 210px !important;
      max-width: 210px !important;
    }


    /* ==================================================
       COLUMNAS FIJAS CON CSS STICKY
       No usamos el plugin FixedColumns.
    ================================================== */
    
    #tablaCalendario th,
    #tablaCalendario td {
      box-sizing: border-box;
    }
    
    /* Columna 1: N° Negocio */
    #tablaCalendario th:nth-child(1),
    #tablaCalendario td:nth-child(1) {
      position: sticky;
      left: 0;
    }
    
    /* Columna 2: Grupo */
    #tablaCalendario th:nth-child(2),
    #tablaCalendario td:nth-child(2) {
      position: sticky;
      left: 90px;
    }
    
    /* Columna 3: Pax */
    #tablaCalendario th:nth-child(3),
    #tablaCalendario td:nth-child(3) {
      position: sticky;
      left: 315px;
    }
    
    /* Columna 4: Destino / Programa */
    #tablaCalendario th:nth-child(4),
    #tablaCalendario td:nth-child(4) {
      position: sticky;
      left: 415px;
    }
    
    /* Columna 5: Hoteles */
    #tablaCalendario th:nth-child(5),
    #tablaCalendario td:nth-child(5) {
      position: sticky;
      left: 605px;
    }
    
    /* Columna 6: Vuelos */
    #tablaCalendario th:nth-child(6),
    #tablaCalendario td:nth-child(6) {
      position: sticky;
      left: 830px;
    }
    
    /* Encabezados fijos por encima de las celdas */
    #tablaCalendario thead th:nth-child(-n+6) {
      z-index: 40;
    }
    
    /* Celdas fijas por encima de las fechas */
    #tablaCalendario tbody td:nth-child(-n+6) {
      z-index: 12;
    }
    
    /* Separación visual después de Vuelos */
    #tablaCalendario th:nth-child(6),
    #tablaCalendario td:nth-child(6) {
      border-right: 3px solid #7d97b0 !important;
      box-shadow:
        8px 0 12px -10px rgba(15, 23, 42, 0.9);
    }


    /* ==================================================
       MODAL HISTORIAL
    ================================================== */

    #modalHistorial {
      position: fixed;
      z-index: 9999;
      top: 4%;
      right: 3%;
      bottom: 4%;
      left: 3%;
      overflow: auto;
      padding: 22px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #fff;
      box-shadow:
        0 24px 60px rgba(15, 23, 42, 0.28);
      box-sizing: border-box;
    }

    .historial-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .historial-toolbar input,
    .historial-toolbar button {
      min-height: 38px;
    }

    #buscadorHistorial {
      min-width: 260px;
      flex: 1 1 300px;
    }

    #tablaCalendario_wrapper .dataTables_scrollHead table,
    #tablaCalendario_wrapper .dataTables_scrollBody table {
      border-collapse: separate !important;
      border-spacing: 0 !important;
    }


    /* ==================================================
       RESPONSIVE
    ================================================== */

    @media (max-width: 900px) {
      main {
        padding-right: 8px;
        padding-left: 8px;
      }

      #toolbar .column {
        width: 100%;
        flex: 1 1 100%;
      }

      #toolbar button {
        width: 100%;
      }

      #modalHistorial {
        top: 2%;
        right: 2%;
        bottom: 2%;
        left: 2%;
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- Encabezado común -->
  <div id="encabezado"></div>

  <main>

    <h1>CALENDARIO DE ACTIVIDADES</h1>

    <div class="calendar-source-info">
      <span class="calendar-source-dot"></span>

      <span>
        Calendario conectado al resumen operativo.
      </span>
    </div>


    <!-- Barra de carga -->
    <div
      id="loadBox"
      class="load-box"
      style="display:none;"
    >
      <div id="loadTitle">
        Cargando...
      </div>

      <div id="loadDetail">
        Preparando calendario
      </div>

      <div class="load-track">
        <div
          id="loadProgress"
          class="load-progress"
        ></div>
      </div>
    </div>


    <!-- Filtros y acciones -->
    <div
      id="toolbar"
      class="toolbar"
    >
      <div class="row">

        <div class="column long">
          <input
            type="text"
            id="buscador"
            placeholder="🔍 Buscar grupo, negocio, hotel, vuelo o actividad..."
            autocomplete="off"
          >
        </div>

        <div class="column medium">
          <select
            id="filtroDestino"
            aria-label="Filtrar por destino"
          >
            <option value="">
              Todos los destinos
            </option>
          </select>
        </div>

        <div class="column medium">
          <select
            id="filtroAno"
            aria-label="Filtrar por año"
          >
            <option value="">
              Todos los años
            </option>
          </select>
        </div>

        <div class="column medium">
          <input
            type="date"
            id="filtroFechaDesde"
            title="Mostrar actividades desde esta fecha"
          >
        </div>

        <button
          type="button"
          id="btn-toggle-edit"
          title="Editar actividades del itinerario"
        >
          🔓 Activar Edición
        </button>

        <button
          type="button"
          id="btn-view-history"
        >
          📜 Ver Historial
        </button>

        <button
          type="button"
          id="btn-export-excel"
        >
          📤 Exportar Excel
        </button>

      </div>
    </div>


    <!-- Barra horizontal superior -->
    <div id="scrollCalendarioSuperior">
      <div id="scrollCalendarioSuperiorContenido"></div>
    </div>


    <!-- Tabla -->
    <div class="tabla-calendario-wrapper">

      <table
        id="tablaCalendario"
        class="display nowrap"
        style="width:100%"
      >
        <thead>
          <tr id="encabezadoCalendario"></tr>
        </thead>

        <tbody id="cuerpoCalendario"></tbody>
      </table>

    </div>

  </main>


  <!-- Modal historial -->
  <div
    id="modalHistorial"
    class="modal"
    style="display:none;"
  >

    <h2>Historial de cambios</h2>

    <div class="historial-toolbar">

      <input
        type="text"
        id="buscadorHistorial"
        placeholder="🔍 Buscar en historial..."
        autocomplete="off"
      >

      <input
        type="date"
        id="histInicio"
        title="Fecha inicial"
      >

      <input
        type="date"
        id="histFin"
        title="Fecha final"
      >

      <button
        type="button"
        id="btn-refresh-history"
      >
        🔁 Actualizar
      </button>

      <button
        type="button"
        id="btn-close-history"
      >
        ❌ Cerrar
      </button>

    </div>

    <table
      id="tablaHistorial"
      class="display"
      style="width:100%"
    >
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Usuario</th>
          <th>N° Negocio</th>
          <th>Campo</th>
          <th>Antes</th>
          <th>Ahora</th>
        </tr>
      </thead>

      <tbody></tbody>
    </table>

  </div>


  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

  <!-- DataTables -->
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

  <!-- Botones DataTables -->
  <script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.colVis.min.js"></script>

  <!-- FixedHeader -->
  <script src="https://cdn.datatables.net/fixedheader/3.3.2/js/dataTables.fixedHeader.min.js"></script>

  <!-- FixedColumns -->

  <!-- ExcelJS -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

  <!-- FileSaver para descargar ExcelJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>


  <!-- Encabezado y módulos -->
  <script>
    fetch('encabezado.html')
      .then(response => {
        if (!response.ok) {
          throw new Error(
            `No se pudo cargar encabezado.html: ${response.status}`
          );
        }

        return response.text();
      })
      .then(html => {
        document.getElementById('encabezado').innerHTML = html;
      })
      .then(() => {
        const scriptModule = document.createElement('script');

        scriptModule.type = 'module';

        scriptModule.textContent = `
          import './script.js';
          import './calendario.js';
        `;

        document.body.appendChild(scriptModule);
      })
      .catch(error => {
        console.error(
          'Error inicializando calendario:',
          error
        );

        const loadBox = document.getElementById('loadBox');
        const loadTitle = document.getElementById('loadTitle');
        const loadDetail = document.getElementById('loadDetail');

        if (loadBox) {
          loadBox.style.display = 'block';
          loadBox.classList.add('error');
        }

        if (loadTitle) {
          loadTitle.textContent = 'Error al iniciar';
        }

        if (loadDetail) {
          loadDetail.textContent = error.message;
        }
      });
  </script>

</body>
</html>
