<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Finanzas | Rai Trai</title>
  <link rel="icon" type="image/png" href="Logo Raitrai.png">
  <link rel="stylesheet" href="estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <style>
    :root {
      --cf-bg: #f4f6f9;
      --cf-card: #ffffff;
      --cf-text: #182132;
      --cf-muted: #667085;
      --cf-border: #e2e7ee;
      --cf-dark: #172033;
      --cf-blue: #2563eb;
      --cf-red: #b42334;
      --cf-green: #147a50;
      --cf-yellow: #9a6700;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cf-bg); color: var(--cf-text); font-family: Arial, sans-serif; }
    body.modal-open { overflow: hidden; }
    .cf-shell { width: min(1600px, 96vw); margin: 0 auto; padding: 22px 0 40px; }
    .cf-header, .cf-row, .cf-toolbar, .cf-modal-head, .cf-section-head { display: flex; align-items: center; gap: 12px; }
    .cf-header, .cf-modal-head, .cf-section-head { justify-content: space-between; }
    .cf-header { margin-bottom: 18px; flex-wrap: wrap; }
    .cf-header h1 { margin: 0; font-size: 1.7rem; }
    .cf-subtitle, .cf-muted { color: var(--cf-muted); }
    .cf-toolbar { background: var(--cf-card); border: 1px solid var(--cf-border); border-radius: 12px; padding: 14px; margin-bottom: 15px; flex-wrap: wrap; }
    .cf-field { display: grid; gap: 5px; min-width: 170px; }
    .cf-field label { font-size: .82rem; font-weight: 700; color: var(--cf-muted); }
    .cf-field select, .cf-field input, .cf-field textarea { width: 100%; border: 1px solid #cfd6df; border-radius: 8px; padding: 9px 10px; background: #fff; font: inherit; }
    .cf-btn { border: 1px solid var(--cf-border); background: #fff; color: var(--cf-text); border-radius: 8px; padding: 9px 13px; font-weight: 700; cursor: pointer; }
    .cf-btn:hover { filter: brightness(.97); }
    .cf-btn.primary { background: var(--cf-dark); color: #fff; border-color: var(--cf-dark); }
    .cf-btn.blue { background: var(--cf-blue); color: #fff; border-color: var(--cf-blue); }
    .cf-btn.danger { color: var(--cf-red); }
    .cf-btn:disabled { opacity: .5; cursor: wait; }
    .cf-spacer { flex: 1; }
    .cf-status { min-height: 22px; margin: 8px 0; color: var(--cf-muted); }
    .cf-status.error { color: var(--cf-red); font-weight: 700; }
    .cf-destinations { display: grid; grid-template-columns: repeat(4, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .cf-destination { text-align: left; padding: 15px; border: 1px solid var(--cf-border); border-radius: 12px; background: var(--cf-card); cursor: pointer; min-height: 115px; }
    .cf-destination.active { border-color: var(--cf-dark); box-shadow: inset 0 0 0 1px var(--cf-dark); }
    .cf-destination-name { display: block; font-size: 1.04rem; font-weight: 800; margin-bottom: 9px; }
    .cf-destination-balance { display: block; margin-top: 4px; font-weight: 700; color: var(--cf-red); }
    .cf-card { background: var(--cf-card); border: 1px solid var(--cf-border); border-radius: 12px; padding: 16px; }
    .cf-financial-groups { display: grid; gap: 20px; }
    .cf-service-block { border: 1px solid var(--cf-border); border-radius: 14px; overflow: hidden; background: #fff; }
    .cf-service-block.hotel { border-color: #c7d7f2; box-shadow: 0 8px 24px rgba(37,99,235,.07); }
    .cf-service-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 15px 17px; background: #f8fafc; border-bottom: 1px solid var(--cf-border); }
    .cf-service-block.hotel .cf-service-title { background: #edf4ff; border-bottom-color: #c7d7f2; }
    .cf-service-title h3 { margin: 0; font-size: 1rem; }
    .cf-service-title p { margin: 3px 0 0; color: var(--cf-muted); font-size: .82rem; }
    .cf-currency-group + .cf-currency-group { border-top: 1px solid var(--cf-border); }
    .cf-currency-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 17px; background: #fcfcfd; }
    .cf-currency-name { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; }
    .cf-currency-pill { display: inline-flex; min-width: 42px; justify-content: center; padding: 4px 8px; border-radius: 7px; background: var(--cf-dark); color: #fff; font-size: .74rem; }
    .cf-currency-totals { color: var(--cf-muted); font-size: .82rem; text-align: right; }
    .cf-currency-totals strong { color: var(--cf-text); }
    .cf-provider-name small { display: block; margin-top: 3px; color: var(--cf-muted); font-weight: 400; }
    .cf-table tfoot th { background: #f8fafc; }
    .cf-state { display: inline-flex; padding: 4px 8px; border-radius: 999px; font-size: .75rem; font-weight: 800; white-space: nowrap; }
    .cf-state.payable { color: #344054; background: #eef1f5; }
    .cf-state.partial { color: #175cd3; background: #eaf2ff; }
    .cf-state.paid { color: var(--cf-green); background: #def7eb; }
    .cf-state.warning { color: var(--cf-yellow); background: #fff4d6; }
    .cf-state.credit { color: #6941c6; background: #f1ebff; }
    .cf-section-head { margin-bottom: 12px; flex-wrap: wrap; }
    .cf-section-head h2, .cf-section-head h3 { margin: 0; }
    .cf-table-wrap { overflow-x: auto; }
    .cf-table { width: 100%; border-collapse: collapse; }
    .cf-table th, .cf-table td { border-bottom: 1px solid #edf0f4; padding: 10px 9px; text-align: left; vertical-align: middle; }
    .cf-table th { font-size: .8rem; color: var(--cf-muted); background: #fafbfc; white-space: nowrap; }
    .cf-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .cf-table .saldo { color: var(--cf-red); font-weight: 800; }
    .cf-table .ok { color: var(--cf-green); font-weight: 800; }
    .cf-table .multi-money span { display: block; }
    .cf-empty { padding: 38px 15px; text-align: center; color: var(--cf-muted); }
    .cf-badge { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #edf2ff; color: #294d9b; font-size: .76rem; font-weight: 800; }
    .cf-badge.pending { background: #fff4d6; color: var(--cf-yellow); }
    .cf-badge.reviewed { background: #def7eb; color: var(--cf-green); }
    .cf-backdrop { position: fixed; inset: 0; display: none; background: rgba(16, 24, 40, .62); z-index: 3000; padding: 18px; }
    .cf-backdrop.open { display: block; }
    .cf-modal { width: min(1450px, 98vw); max-height: calc(100vh - 36px); overflow: auto; margin: 0 auto; background: #fff; border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.28); }
    .cf-modal-head { position: sticky; top: 0; z-index: 4; background: #fff; padding: 15px 18px; border-bottom: 1px solid var(--cf-border); }
    .cf-modal-head h2 { margin: 0; }
    .cf-modal-body { padding: 18px; }
    .cf-metrics { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .cf-metric { background: #f6f8fb; border-radius: 10px; padding: 13px; }
    .cf-metric-label { display: block; font-size: .77rem; font-weight: 800; color: var(--cf-muted); margin-bottom: 6px; }
    .cf-metric-value { font-size: 1.05rem; font-weight: 800; }
    .cf-tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--cf-border); margin-bottom: 15px; overflow-x: auto; }
    .cf-tab { border: 0; background: transparent; padding: 11px 13px; color: var(--cf-muted); font-weight: 800; cursor: pointer; border-bottom: 3px solid transparent; }
    .cf-tab.active { color: var(--cf-text); border-bottom-color: var(--cf-text); }
    .cf-tab-panel[hidden] { display: none; }
    .cf-form-grid { display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 12px; }
    .cf-form-grid .wide { grid-column: 1 / -1; }
    .cf-form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    dialog { width: min(680px, 94vw); border: 0; border-radius: 12px; padding: 0; box-shadow: 0 22px 65px rgba(0,0,0,.28); }
    dialog::backdrop { background: rgba(16,24,40,.6); }
    .cf-dialog-head { padding: 15px 17px; border-bottom: 1px solid var(--cf-border); }
    .cf-dialog-head h3 { margin: 0; }
    .cf-dialog-body { padding: 17px; }
    @media (max-width: 950px) { .cf-destinations { grid-template-columns: repeat(2, 1fr); } .cf-metrics { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 560px) { .cf-shell { width: 94vw; } .cf-destinations, .cf-metrics, .cf-form-grid { grid-template-columns: 1fr; } .cf-form-grid .wide { grid-column: auto; } .cf-btn { min-height: 42px; } }
/* Control Finanzas: jerarquía visual y separación de monedas */
.cf-shell {max-width:1800px;width:96vw;font-size:14px;line-height:1.4;color:#172b4d}
.cf-shell .cf-header h1 {font-size:27px;color:#12345a}
.cf-destinations {display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.cf-destination {min-height:48px;min-width:145px;border:2px solid #b9c9df;padding:12px 18px;background:#fff;color:#17365d;border-radius:9px}
.cf-destination-name {color:inherit!important;margin:0;font-size:14px;letter-spacing:.03em}
.cf-destination.active {background:#17365d;color:#fff;border-color:#17365d;box-shadow:0 3px 9px #17365d30}
.cf-destination:hover {border-color:#2563eb;background:#edf4ff;color:#17365d}
.cf-destination:focus-visible,.cf-btn:focus-visible {outline:3px solid #f5b700;outline-offset:3px}
.cf-planning {border:1px solid #b9cde7;border-top:5px solid #17365d;border-radius:12px;background:#f5f8ff;margin:10px 0 26px;padding:20px}
.cf-plan-title {display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.cf-plan-title h3 {font-size:21px;margin:0 0 4px;color:#17365d}
.cf-plan-title p {margin:0;color:#445570}
.cf-kpi-grid,.cf-budget-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cf-kpi {background:#fff;border:1px solid #ccd5e2;border-top:5px solid var(--moneda,#64748b);border-radius:9px;padding:16px}
.cf-kpi>span,.cf-budget>span {display:block;font-size:12px;font-weight:bold;letter-spacing:.04em}
.cf-kpi strong,.cf-budget strong {display:block;font-size:26px;line-height:1.3;margin:8px 0;color:#132c4c}
.cf-kpi small,.cf-budget small {display:block;color:#475569;line-height:1.5}
.moneda-BRL {--moneda:#087f5b;--fondo:#e3f6ed}
.moneda-ARS {--moneda:#176e9f;--fondo:#e4f2fc}
.moneda-USD {--moneda:#344cc1;--fondo:#e9edff}
.moneda-CLP {--moneda:#986400;--fondo:#fff3cf}
.moneda-SIN_DEFINIR {--moneda:#626b7b;--fondo:#eef0f4}
.cf-rates {display:flex;gap:20px;flex-wrap:wrap;align-items:end;margin:18px 0;padding:17px;background:#fff;border:1px solid #cbd7e8;border-radius:9px}
.cf-rates .cf-field {font-weight:bold;color:#263a57;font-size:13px;min-width:240px}
.cf-rate-line {display:flex;align-items:center;gap:8px;white-space:nowrap}
.cf-rates input[type=number] {width:145px;min-height:40px;border:2px solid #acbdd4;background:#fffdf0;border-radius:6px;padding:8px;font:inherit}
.cf-check-line {display:flex;gap:9px;align-items:center;min-height:40px;font-weight:bold}
.cf-shell input[type=checkbox],dialog input[type=checkbox] {width:17px!important;height:17px!important;min-width:17px!important;min-height:17px!important;display:inline-block!important;margin:0 6px 0 0;vertical-align:middle}
.cf-budget {background:#17365d;border-radius:10px;padding:18px;color:white}
.cf-budget strong,.cf-budget small {color:white}
.cf-budget.clp {background:#07594b}
.cf-plan-note {margin:15px 0 0;font-size:13px;color:#35465f}
.cf-financial-groups {gap:28px}
.cf-currency-group {border:1px solid #bdcce0;border-top:6px solid var(--moneda,#64748b);border-radius:10px;overflow:hidden;background:white;margin-bottom:4px}
.cf-currency-head {padding:16px;background:var(--fondo,#eef2f6);color:#172b4d;border-bottom:1px solid #bdcce0;flex-wrap:wrap;font-size:13px}
.cf-currency-name {font-size:16px}
.cf-currency-pill {background:var(--moneda,#64748b);color:white;font-size:13px;padding:5px 10px}
.cf-table {font-size:13px;width:100%;line-height:1.4}
.cf-table th {background:#f1f5fa;color:#314764;padding:12px 10px}
.cf-provider-table {min-width:1120px}
.cf-provider-table th:first-child {width:22%}
.cf-provider-table th:nth-child(2) {width:25%}
.cf-table td {padding:12px 10px;border-bottom:1px solid #dce4ef}
.cf-provider-total td {background:#eaf0fa;border-top:2px solid #bfcee3;font-weight:bold}
.cf-provider-name strong {font-size:14px;color:#102f56}
.cf-provider-name small,.cf-service-child small {display:block;color:#485b75;font-size:12px;margin-top:4px;font-weight:normal}
.cf-total-label {font-size:11px;color:#435776;letter-spacing:.03em}
.cf-service-child td {background:#fff;padding-top:9px;padding-bottom:9px}
.cf-service-child:nth-child(even) td {background:#f9fbfe}
.cf-child-marker {font-weight:bold;color:#375681;margin-right:4px}
.cf-child-payment {color:#6b778a;font-size:11px;font-style:italic}
.cf-partial {display:block;color:#936100;font-size:10px;font-weight:bold}
.cf-table tfoot .cf-destination-total th {background:var(--moneda,#17365d);color:#fff!important;border:0;padding:16px 10px;font-size:13px}
.cf-detail-service {border:1px solid #c4d2e6;border-radius:10px;overflow:hidden;margin-bottom:24px}
.cf-detail-service>header {background:#17365d;color:#fff;padding:16px 18px;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.cf-detail-service>header h3 {margin:0;color:white;font-size:17px}
.cf-detail-service .cf-table tbody tr:nth-child(even) {background:#f1f6fc}
.cf-detail-service .cf-table tfoot th {background:#dbe9fa;color:#153b69;font-size:14px}
.cf-date {white-space:nowrap}
.cf-dest-choice {display:flex;gap:8px;padding:12px;border-bottom:1px solid #e1e6ee;align-items:center}
.cf-shell .cf-btn,.cf-backdrop .cf-btn,dialog .cf-btn {min-height:38px;border-radius:7px;font-size:13px}
.cf-modal {width:min(1660px,98vw)}
.cf-modal-head {background:#edf3fc;border-bottom:3px solid #17365d}
.cf-tabs {gap:8px}
.cf-tab {background:#edf2f8;border-radius:7px 7px 0 0}
.cf-tab.active {background:#17365d;color:white;border-bottom-color:#17365d}
.cf-backdrop .cf-metrics .cf-metric {border:1px solid #c4d2e6;border-left:5px solid #375c95;background:#f3f7fe}
.cf-shell select,.cf-backdrop select,dialog select {height:40px!important;min-height:40px!important;max-height:40px!important;padding:8px!important;font-size:14px!important}
dialog .cf-field input:not([type=checkbox]),dialog .cf-field textarea,dialog .cf-field select {width:100%;border:1px solid #bac8db;border-radius:6px;padding:9px;font:inherit;background:white}
dialog .cf-form-grid fieldset {min-width:0;border:1px solid #c4d2e6;padding:12px;border-radius:6px;grid-column:1/-1}
dialog .cf-form-grid fieldset label {display:flex;gap:6px;align-items:center;margin:8px 0}
dialog .cf-form-grid fieldset input[type=number] {max-width:110px}
@media(max-width:700px){.cf-shell{width:96vw}.cf-planning{padding:13px}.cf-kpi strong,.cf-budget strong{font-size:22px}.cf-destination{min-width:120px;flex:1}.cf-rates{padding:12px;gap:12px}.cf-kpi-grid,.cf-budget-grid{grid-template-columns:1fr}.cf-currency-name{font-size:14px}.cf-header .cf-row{flex-wrap:wrap}.cf-plan-title h3{font-size:18px}}

.cf-btn.primary,.cf-btn.blue {background:#e6edf7;color:#345477;border:1px solid #b7c8df}
@media(max-width:700px){.cf-provider-table th:first-child,.cf-provider-table td:first-child{width:180px;min-width:180px}.cf-provider-table th:nth-child(2),.cf-provider-table td:nth-child(2){left:180px;width:240px;min-width:240px}.cf-table-wrap{max-height:62vh}}

.cf-provider-table tfoot th:first-child,.cf-provider-table tfoot th:nth-child(2){position:static;left:auto;z-index:auto}
.cf-provider-table thead th:first-child,.cf-provider-table thead th:nth-child(2){z-index:6}
.cf-provider-table tbody td:first-child{background:#f7f9fc}
.cf-metric-value{color:#334e70}
</style>
</head>
<body>
  <main class="cf-shell">
    <header class="cf-header">
      <div>
        <h1>CONTROL FINANZAS</h1>
        <div class="cf-subtitle">Pagos pendientes por destino y proveedor</div>
      </div>
      <div class="cf-row">
        <span id="usuarioConectado" class="cf-muted"></span>
        <a class="cf-btn" href="index.html">Volver</a>
        <button id="btnExportarTodo" class="cf-btn primary" type="button">Exportar todo a Excel</button>
      </div>
    </header>

    <section class="cf-toolbar" aria-label="Filtros">
      <div class="cf-field">
        <label for="filtroAno">Año de viaje</label>
        <select id="filtroAno"></select>
      </div>
      <div class="cf-field">
        <label for="filtroTipo">Mostrar</label>
        <select id="filtroTipo">
          <option value="TODOS">Actividades y hoteles</option>
          <option value="ACTIVIDAD">Solo actividades</option>
          <option value="HOTEL">Solo hoteles</option>
        </select>
      </div>
      <div class="cf-spacer"></div>
      <button id="btnGestionarDestinos" class="cf-btn" type="button">Mostrar / ocultar destinos</button>
      <button id="btnRecargar" class="cf-btn" type="button">Actualizar información</button>
    </section>

    <div id="estadoCarga" class="cf-status" role="status" aria-live="polite"></div>
    <section id="destinos" class="cf-destinations" aria-label="Destinos"></section>

    <section class="cf-card">
      <div class="cf-section-head">
        <div>
          <h2 id="tituloDestino">Seleccione un destino</h2>
          <div id="subtituloDestino" class="cf-muted">Los saldos se mantienen separados por moneda.</div>
        </div>
        <button id="btnExportarDestino" class="cf-btn" type="button" disabled>Exportar destino</button>
      </div>
      <div id="planificacionDestino"></div>
      <div id="gruposFinancieros" class="cf-financial-groups"></div>
      <div id="sinProveedores" class="cf-empty" hidden>No hay proveedores para esta selección.</div>
    </section>
  </main>

  <div id="detalleBackdrop" class="cf-backdrop" aria-hidden="true">
    <section class="cf-modal" role="dialog" aria-modal="true" aria-labelledby="detalleTitulo">
      <header class="cf-modal-head">
        <div><h2 id="detalleTitulo">Detalle del proveedor</h2><div id="detalleSubtitulo" class="cf-muted"></div></div>
        <div class="cf-row"><button id="btnExportarProveedor" class="cf-btn" type="button">Exportar proveedor</button><button id="btnCerrarDetalle" class="cf-btn" type="button">Cerrar</button></div>
      </header>
      <div class="cf-modal-body">
        <div id="detalleEstado" class="cf-status" role="status"></div>
        <section id="metricasProveedor" class="cf-metrics"></section>
        <nav class="cf-tabs" aria-label="Secciones del proveedor">
          <button class="cf-tab active" data-tab="obligaciones" type="button">Costos</button>
          <button class="cf-tab" data-tab="abonos" type="button">Abonos</button>
          <button class="cf-tab" data-tab="reglas" type="button">Reglas</button>
          <button class="cf-tab" data-tab="historial" type="button">Historial</button>
        </nav>
        <section id="panel-obligaciones" class="cf-tab-panel"></section>
        <section id="panel-abonos" class="cf-tab-panel" hidden></section>
        <section id="panel-reglas" class="cf-tab-panel" hidden></section>
        <section id="panel-historial" class="cf-tab-panel" hidden></section>
      </div>
    </section>
  </div>

  <dialog id="dialogEditarAbono">
    <div class="cf-dialog-head"><h3>Revisar aplicación del abono</h3></div>
    <form id="formEditarAbono" class="cf-dialog-body">
      <input id="abonoId" type="hidden">
      <div class="cf-form-grid">
        <div class="cf-field"><label for="abMonedaEnviada">Moneda enviada</label><input id="abMonedaEnviada" readonly></div>
        <div class="cf-field"><label for="abMontoEnviado">Monto enviado</label><input id="abMontoEnviado" type="number" readonly></div>
        <div class="cf-field"><label for="abMonedaAplicada">Moneda aplicada</label><select id="abMonedaAplicada"><option>CLP</option><option>USD</option><option>BRL</option><option>ARS</option></select></div>
        <div class="cf-field"><label for="abTipoCambio">Tipo de cambio aplicado</label><input id="abTipoCambio" type="number" min="0" step="0.0001"></div>
        <div class="cf-field"><label for="abMontoAplicado">Monto reconocido/aplicado</label><input id="abMontoAplicado" type="number" min="0" step="0.01" required></div>
        <div class="cf-field"><label for="abCoberturaUnidad">Unidad de cobertura</label><select id="abCoberturaUnidad" disabled><option value="PAX">Pax / cupos de esta actividad</option><option value="PAX_NOCHE">Personas-noches del hotel</option></select></div><div class="cf-field"><label for="abUnidadesCubiertas">Pax / cupos cubiertos por este abono</label><input id="abUnidadesCubiertas" type="number" min="0" step="1" placeholder="Vacío = por confirmar"><small>Informar la cobertura real del pago. No se calcula desde el dinero.</small></div>
        <div class="cf-field wide"><label for="abMotivo">Motivo u observación de la revisión</label><textarea id="abMotivo" rows="3" required></textarea></div>
      </div>
      <div id="errorEditarAbono" class="cf-status error"></div>
      <div class="cf-form-actions"><button id="btnCancelarEdicion" class="cf-btn" type="button">Cancelar</button><button class="cf-btn blue" type="submit">Guardar revisión</button></div>
    </form>
  </dialog>

  <script type="module" src="control-finanzas.js"></script>
</body>
</html>
